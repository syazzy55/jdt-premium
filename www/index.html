<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JDT Premium</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080e1c;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:100px
}
header{
background:linear-gradient(135deg,#b50028,#102e65);
text-align:center;
padding:30px 15px;
border-bottom:4px solid #ed173b
}
header img{
width:100px;
height:100px;
object-fit:contain
}
h1{font-size:27px;margin:12px 0}
h2{font-size:19px}
small,.muted{color:#a5b7d5;font-size:12px}
main{padding:15px;max-width:800px;margin:auto}
.card{
background:linear-gradient(145deg,#182b49,#101c32);
border:1px solid #304568;
border-radius:18px;
padding:18px;
margin-bottom:14px
}
.teams{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
text-align:center;
margin:20px 0
}
.team{flex:1;font-size:13px}
.team img{
width:64px;
height:64px;
object-fit:contain;
display:block;
margin:0 auto 10px
}
.placeholder{
width:64px;
height:64px;
margin:0 auto 10px;
border-radius:50%;
background:#304568;
display:grid;
place-items:center;
font-weight:bold
}
.score{font-size:27px;font-weight:bold}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.tile{
background:#182b49;
border:1px solid #304568;
border-radius:15px;
padding:22px 10px;
color:white;
font-size:15px
}
.tile span{font-size:27px}
nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#101c32;
display:flex;
justify-content:space-around;
border-top:2px solid #ed173b;
padding:15px 0 calc(15px + env(safe-area-inset-bottom))
}
nav button{
background:none;
border:0;
color:white;
font-size:12px
}
select{
width:100%;
background:#182b49;
color:white;
border:1px solid #304568;
padding:13px;
border-radius:10px;
margin-bottom:15px
}
.win{color:#4ade80}
.draw{color:#facc15}
.loss{color:#fb7185}
.center{text-align:center}
.tag{
font-size:11px;
color:#c7d5ed;
letter-spacing:1px
}
.standings-scroll{overflow-x:auto}
.standings-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.standings-table th,.standings-table td{padding:9px 5px;text-align:center;border-bottom:1px solid #304568}
.standings-table td:nth-child(2){text-align:left}
.standings-table img{width:23px;height:23px;object-fit:contain;vertical-align:middle;margin-right:5px}
.standings-table tr.jdt-row{background:#234776;color:#fff;font-weight:bold}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary-grid button{padding:12px 4px;font-size:12px}
.form-chip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;margin:2px;font-weight:bold;color:#fff}
.form-win{background:#166534}.form-draw{background:#85620b}.form-loss{background:#a32640}
.standings-table tr.zone-row td:first-child{box-shadow:inset 3px 0 #4ade80}
.standings-table td:nth-child(2){white-space:normal;min-width:105px}
.live-pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.live-pulse{animation:none}}
.detail-button{width:100%;padding:12px;margin-top:14px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #304568}.detail-row span:last-child{text-align:right}
.detail-tabs{display:flex;gap:6px;overflow:auto;position:sticky;top:0;background:#080e1c;padding:8px 0;z-index:2}.detail-tabs button{white-space:nowrap;padding:10px;border:1px solid #304568;border-radius:9px;background:#182b49;color:white}.detail-tabs button.active{background:#28569a}.player-rating{padding:4px 8px;border-radius:6px;color:white;font-weight:bold}.pitch{background:repeating-linear-gradient(#19513b 0 45px,#204f39 45px 90px);border:1px solid #83aa94;border-radius:8px;padding:10px;margin:12px 0}.pitch-row{display:flex;justify-content:space-around;gap:3px;margin:15px 0}.pitch-player{flex:1;min-width:0;text-align:center;font-size:10px;overflow-wrap:anywhere}.pitch-player img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#243c59}.pitch-number{display:block;font-weight:bold}.detail-row img{border-radius:50%}.detail-row>span:first-child{min-width:42px}
.pitch{position:relative;isolation:isolate;padding:12px 5px;overflow:hidden}.pitch-markings{position:absolute;inset:7px;border:1px solid #ffffff65;border-radius:3px;pointer-events:none;z-index:-1}.pitch-markings i{position:absolute;top:50%;left:0;right:0;border-top:1px solid #ffffff65}.pitch-markings i:after{content:'';position:absolute;width:64px;height:64px;border:1px solid #ffffff65;border-radius:50%;left:50%;top:0;transform:translate(-50%,-50%)}.pitch-markings b,.pitch-markings em{position:absolute;left:25%;width:50%;height:12%;border:1px solid #ffffff65}.pitch-markings b{top:0;border-top:0}.pitch-markings em{bottom:0;border-bottom:0}.pitch-row{align-items:flex-start;margin:12px 0;gap:4px}.pitch-player summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}.pitch-player summary::-webkit-details-marker{display:none}.pitch-name{line-height:1.2;min-height:24px;display:flex;align-items:center;justify-content:center}.pitch-rating{display:block;line-height:1.5}.pitch-rating .player-rating{display:inline-block;padding:2px 6px}.pitch-events{font-size:10px}.pitch-stats{display:block;background:#102239;padding:5px;border-radius:5px;margin-top:4px;line-height:1.4}.pitch-player img{width:34px;height:34px}
.pitch-trigger{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:white;width:100%;padding:0;font:inherit;cursor:pointer}.pitch-team{text-align:center;font-weight:bold;color:white;padding:5px;background:#102239;border-radius:5px}.pitch-row{margin:10px 0}.pitch-name{min-height:20px}#pitch-popup{background:#14243c;color:white;border:1px solid #456184;border-radius:14px;padding:20px;width:min(85vw,360px)}#pitch-popup::backdrop{background:#0009}#pitch-popup button{background:#28569a;color:white;border:0;border-radius:8px;padding:10px 20px}.popup-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.popup-head h3{margin:0 0 6px}.popup-head p{margin:0 0 8px;color:#b7c8df}.popup-photo{width:76px;height:76px;border-radius:50%;object-fit:cover}.popup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}.popup-grid>div{background:#203650;border-radius:10px;padding:12px;text-align:center}.popup-grid small{display:block;color:#b7c8df;margin-bottom:5px}.popup-grid strong{display:block;font-size:23px}#pitch-popup{box-sizing:border-box;max-height:85vh;overflow:auto}#pitch-popup>button{width:100%}#pitch-popup .profile-close{position:sticky;bottom:0;z-index:2;box-shadow:0 -5px 12px #14243c;background:#28569a}.profile-club,.profile-flag{width:23px;height:18px;object-fit:contain;vertical-align:middle;margin-right:6px}.profile-select{grid-column:1/-1;width:100%;padding:12px;background:#203650;color:white;border:1px solid #456184;border-radius:8px}.popup-grid>.profile-bar{grid-column:1/-1;text-align:left}.profile-bar>div{height:8px;background:#14243c;border-radius:8px;overflow:hidden}.profile-bar i{display:block;height:100%;background:#4e9cf5;border-radius:8px}#pcSearch,#pcList button{background:#20344b;color:#fff;border:1px solid #354c68;border-radius:12px;padding:10px}#pcSearch::placeholder{color:#a9bad0}#pcList button small{color:#b9cbe0}#pcPosition{margin-top:10px}.pc-rank{display:flex;gap:10px;align-items:center;padding:10px 0}.pc-rank>div{flex:1;min-width:0}.pc-track{height:7px;background:#0d192b;border-radius:8px;margin-top:8px;overflow:hidden}.pc-track i{display:block;height:100%;background:#5098e9;border-radius:8px}.pc-versus{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin:12px 0}.pc-versus>div{padding:10px;background:#20344b;border-radius:12px}</style>
</head>
<body>

<header>
<img src="logos/JDT.png" alt="Logo JDT">
<h1>JDT PREMIUM</h1>
<p>MATCH CENTRE • 2026/2027</p>
<small>LUASKAN KUASAMU JOHOR</small>
</header>

<main id="content">Memuatkan data...</main>

<nav>
<button onclick="home()">🏠<br>Home</button>
<button onclick="showMatches('fixtures')">📅<br>Jadual</button>
<button onclick="showMatches('results')">🏆<br>Keputusan</button>
<button onclick="standings()">🏅<br>Kedudukan</button>
<button onclick="stats()">📊<br>Statistik</button>
</nav>

<script>
let data={fixtures:[],results:[]};
const content=document.getElementById('content');

const logos={
'JDT':'JDT.png',
'Ratchaburi FC':'ratchaburi.png',
'Daejeon Hana Citizen':'daejeon.webp',
'Kuala Lumpur City':'klcity.jpeg',
'Cong An Hanoi':'congan.png',
'Brunei DPMM':'dpmm.png',
'Jeonbuk':'jeonbuk.png',
"Shan United":"shan.png",
"Persib Bandung":"persib.png",
"Penang FC":"penang.png",
"Sabah FC":"sabah.png",
"Selangor FC":"selangor.png",
"Melaka FC":"melaka.png",
"Kelantan Red Warrior":"kelantan.png",
"Kuching City":"kuching.png",
"Newcastle Jets":"newcastle.png",
"Negeri Sembilan":"negeri.png",
"Terengganu FC":"terengganu.png",
"Star City":"starcity.png",
"Port FC":"port.png",
"Pohang Steelers":"pohang.png",
"Svay Rieng":"svayrieng.png",
"Buriram United":"buriram.png",
"UM-Damansara United":"umdamansara.png"
};

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

function team(name){
const short=esc(name.split(' ').map(x=>x[0]).join('').slice(0,3));
const file=logos[name];
return `<div class="team">
${file?`<img src="${file.startsWith('https://')?file:'logos/'+file}" alt="${esc(name)}" ${file==='klcity.jpeg'?'style="border-radius:50%;"':''}
onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
<div class="placeholder" style="display:none">${short}</div>`
:`<div class="placeholder">${short}</div>`}
${esc(name)}</div>`;
}

function dateText(date){
return new Date(date+'T12:00:00+08:00')
.toLocaleDateString('ms-MY',{
day:'numeric',month:'long',year:'numeric',
timeZone:'Asia/Kuala_Lumpur'
});
}

function upcoming(){
return data.fixtures.filter(m=>
(m.time ? new Date(m.date+'T'+m.time+':00+08:00') : new Date(m.date+'T23:59:59+08:00'))>new Date()
).sort((a,b)=>
(a.date+a.time).localeCompare(b.date+b.time));
}

function matchCard(m,result=false){
const away=m.venue==='Away';
const live=m.status==='inprogress'||m.status==='live';
let score='VS';
let status='';
if(live){
if(Number.isFinite(m.jdtScore)&&Number.isFinite(m.opponentScore))score=away?m.opponentScore+' - '+m.jdtScore:m.jdtScore+' - '+m.opponentScore;
status='<b class="loss"><span class="live-pulse">●</span> LIVE • '+esc(m.liveLabel||'Sedang berlangsung')+'</b>';
}else if(result){
score=away?
m.opponentScore+' - '+m.jdtScore:
m.jdtScore+' - '+m.opponentScore;
status='<small>FT • Tamat</small><br>'+(m.jdtScore>m.opponentScore?
'<b class="win">MENANG</b>':
m.jdtScore===m.opponentScore?
'<b class="draw">SERI</b>':
'<b class="loss">KALAH</b>');
}
return `<div class="card">
<div class="tag">${esc(m.competition)}</div>
<div class="teams">
${team(away?m.opponent:'JDT')}
<div class="score">${score}</div>
${team(away?'JDT':m.opponent)}
</div>
<div class="center">
${dateText(m.date)}
${result?'':' • '+(m.time?esc(m.time)+' MYT':'Masa belum disahkan')}
<p class="muted">${away?'AWAY':'HOME'}</p>
${m.stadium?`<p class="muted">🏟️ ${esc(m.stadium)}</p>`:''}
${!live&&!result&&Number.isFinite(kickoff(m))&&kickoff(m)<=Date.now()?'<p class="muted">Waktu sepak mula telah berlalu • keputusan belum disahkan</p>':''}
${status}
</div>
${currentView!=='detail'?`<button class="tile detail-button" data-match="${esc(matchKey(m))}" onclick="openDetails(this.dataset.match)">📋 Maklumat perlawanan ›</button>`:''}
</div>`;
}

let currentView='home', currentFilter='all', loading=false;
let detailKey='',detailBack='home',detailFilter='all',detailTab='all',statPeriod='all';
function matchKey(m){return m.id!=null?'id:'+m.id:JSON.stringify([m.date,m.opponent,m.competition]);}
function openDetails(key){detailBack=currentView;detailFilter=currentFilter;detailKey=key;detailTab='all';statPeriod='all';renderDetails();window.scrollTo(0,0);}
function closeDetails(){if(detailBack==='fixtures'||detailBack==='results')showMatches(detailBack,detailFilter);else home();}
let detailCache={}, detailFetched=0, detailLoading=false;
async function refreshDetails(){
if(detailLoading||Date.now()-detailFetched<60000)return;
detailLoading=true;
try{const r=await fetch('https://raw.githubusercontent.com/syazzy55/jdt-premium/main/www/details.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP');detailCache=await r.json();detailFetched=Date.now();try{localStorage.setItem('jdtDetails',JSON.stringify(detailCache));}catch(e){}}
catch(e){try{detailCache=JSON.parse(localStorage.getItem('jdtDetails'))||detailCache;}catch(e){}}
finally{detailLoading=false;if(currentView==='detail')renderDetails(false);}
}
function setDetailTab(t){detailTab=t;renderDetails(false);}
function setStatPeriod(t){statPeriod=t;renderDetails(false);}
function ratingBadge(v){const n=Number(v);return v==null||v==='—'||!Number.isFinite(n)?'—':'<span class="player-rating" style="background:'+(n>=8?'#1765ad':n>=7?'#187448':n>=6?'#946411':'#a52c42')+'">'+esc(v)+'</span>';}
function pitch(t,events=[],side='',reverse=false,best=null,team=''){const players=(t.players||[]).filter(p=>!p.substitute),lines=String(t.formation||'').split('-').map(Number);if(players.length!==11||lines.some(n=>!Number.isInteger(n)||n<1)||lines.reduce((a,b)=>a+b,0)!==10)return '';let i=0;const rows=[1,...lines].map(n=>'<div class="pitch-row">'+players.slice(i,i+=n).map(p=>{const img=String(p.player?.image||''),id=p.player?.id;const marks=events.filter(e=>e.side===side&&id!=null&&(e.player?.id===id||e.playerOut?.id===id)).map(e=>e.type==='goal'?'⚽':e.type==='card'?(e.detail==='red'?'🟥':'🟨'):e.type==='substitution'?'🔄':'').filter(Boolean).join('');const stats=p.statistics||{};const details=[['Minit',stats.minutesPlayed],['Gol',stats.goals],['Assist',stats.assists],['Hantaran',stats.passes],['Tepat sasaran',stats.shotsOnGoal],['Tackles',stats.tackles],['Interceptions',stats.interceptions],['Saves',stats.saves],['Dribble berjaya',stats.successfulDribbles],['Hantaran tepat',stats.accuratePasses],['Peluang dicipta',stats.keyPasses],['Jumlah percubaan',stats.totalShots],['Sentuhan',stats.touches],['Duel dimenangi',stats.duelsWon]].filter(x=>x[1]!=null).map(x=>x[0]+': '+x[1]).join(' • ');return '<div class="pitch-player"><button type="button" class="pitch-trigger" data-player-id="'+esc(p.player?.id??'')+'" data-player="'+esc(p.player?.name||'—')+'" data-team="'+esc(team)+'" data-profile="'+esc(JSON.stringify({position:p.player?.position?.name||p.position?.name||(typeof p.position==='string'?p.position:null)||(typeof p.player?.position==='string'?p.player.position:null),age:p.player?.age??(()=>{const b=p.dateOfBirth||p.player?.dateOfBirth;if(!b)return null;const d=new Date(b),n=new Date();return Number.isNaN(d.getTime())?null:n.getUTCFullYear()-d.getUTCFullYear()-(n.toISOString().slice(5,10)<d.toISOString().slice(5,10)?1:0)})(),country:p.country?.name||p.player?.country?.name||p.player?.nationality?.name,birth:p.dateOfBirth||p.player?.dateOfBirth,height:(p.heightCm??p.player?.heightCm)!=null?(p.heightCm??p.player?.heightCm)+' cm':null}))+'" data-stats="'+esc(details||'Statistik belum tersedia')+'" onclick="showPitchPlayer(this)">'+(img.startsWith('https://cdn.sportsapi.app/')?'<img loading="lazy" src="'+esc(img)+'" alt="">':'')+'<span class="pitch-number">'+esc(p.jerseyNumber||'')+(best!=null&&Number(p.rating??stats.rating)===best?' ⭐':'')+'</span><span class="pitch-name">'+esc(p.player?.shortName||p.player?.name||'—')+'</span><span class="pitch-rating">'+ratingBadge(p.rating??stats.rating)+'</span>'+(marks?'<span class="pitch-events">'+marks+'</span>':'')+'</button></div>';}).join('')+'</div>');return (reverse?rows.reverse():rows).join('');}
let profileCache=null,profileRequest=null,profileFetched=0;
async function loadPlayerProfiles(){if(profileCache&&Date.now()-profileFetched<60000)return profileCache;if(profileRequest)return profileRequest;profileRequest=(async()=>{for(const url of ['https://raw.githubusercontent.com/syazzy55/jdt-premium/main/www/player-profiles.json?t='+Date.now(),'player-profiles.json']){try{const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)continue;const d=await r.json();if(d&&typeof d==='object'&&!Array.isArray(d)){profileCache=d;profileFetched=Date.now();try{localStorage.setItem('jdtPlayerProfiles',JSON.stringify(d));}catch(e){}return d;}}catch(e){}}try{return profileCache||JSON.parse(localStorage.getItem('jdtPlayerProfiles'))||{};}catch(e){return profileCache||{};}})();try{return await profileRequest;}finally{profileRequest=null;}}
function showPitchPlayer(btn){const old=document.getElementById('pitch-popup');if(old)old.remove();const dlg=document.createElement('dialog');dlg.id='pitch-popup';const head=document.createElement('div');head.className='popup-head';const img=btn.querySelector('img');if(img){const photo=img.cloneNode();photo.className='popup-photo';head.append(photo);}const info=document.createElement('div');const h=document.createElement('h3');h.textContent=btn.dataset.player;const team=document.createElement('p');team.textContent=[btn.dataset.team,btn.querySelector('.pitch-number')?.textContent].filter(Boolean).join(' • #');info.append(h,team);const rating=btn.querySelector('.pitch-rating');if(rating)info.append(rating.cloneNode(true));head.append(info);const grid=document.createElement('div');grid.className='popup-grid';for(const item of (btn.dataset.stats||'Statistik belum tersedia').split(' • ')){const cell=document.createElement('div');const i=item.indexOf(': ');if(i>=0){const label=document.createElement('small');label.textContent=item.slice(0,i);const value=document.createElement('strong');value.textContent=item.slice(i+2);cell.append(label,value);}else{cell.textContent=item;cell.style.gridColumn='1 / -1';}grid.append(cell);}const close=document.createElement('button');close.textContent='Tutup';close.className='profile-close';close.onclick=()=>dlg.close();const profile=document.createElement('div');profile.hidden=true;profile.className='popup-grid';let meta={};try{meta=JSON.parse(btn.dataset.profile||'{}')}catch(e){}const add=(label,value)=>{const cell=document.createElement('div'),l=document.createElement('small'),v=document.createElement('strong');l.textContent=label;v.textContent=value??'—';v.style.fontSize='14px';cell.append(l,v);profile.append(cell);};
const heading=label=>{const el=document.createElement('h3');el.textContent=label;el.style.gridColumn='1 / -1';profile.append(el);};
function draw(entry){profile.replaceChildren();const p=entry?.profile||{};const formatDate=v=>{if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('ms-MY',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(d);};const formatMoney=v=>{try{return new Intl.NumberFormat('ms-MY',{style:'currency',currency:v.currency||'EUR',maximumFractionDigits:0}).format(v.amount);}catch(e){return v.amount+' '+(v.currency||'');}};const icon=(url,cls)=>{if(typeof url!=='string'||!url.startsWith('https://cdn.sportsapi.app/'))return null;const i=document.createElement('img');i.src=url;i.className=cls;i.alt='';return i;};head.querySelectorAll('.profile-club').forEach(e=>e.remove());const club=icon(p.team?.image,'profile-club');if(club)team.prepend(club);const birth=p.dateOfBirth||meta.birth;let age=meta.age;if(birth){const d=new Date(birth),n=new Date();if(!Number.isNaN(d.getTime()))age=n.getUTCFullYear()-d.getUTCFullYear()-(n.toISOString().slice(5,10)<d.toISOString().slice(5,10)?1:0);}
for(const [label,value] of [['Posisi',({goalkeeper:'Penjaga gol',defender:'Pertahanan',midfielder:'Tengah',forward:'Penyerang'})[p.position]||p.position||meta.position],['Umur',age],['Negara',p.country?.name||meta.country],['Tarikh lahir',formatDate(birth)],['Ketinggian',p.heightCm!=null?p.heightCm+' cm':meta.height],['Kaki dominan',({left:'Kiri',right:'Kanan',both:'Kedua-dua'})[p.preferredFoot]||p.preferredFoot],['Nilai pasaran',p.marketValue?.amount!=null?formatMoney(p.marketValue):null],['Tamat kontrak',formatDate(p.contractUntil)]]){add(label,value);if(label==='Negara'){const flag=icon(p.country?.flag,'profile-flag');if(flag)profile.lastElementChild.querySelector('strong').prepend(flag);}}

let standingsFetchedAt=0;
async function refreshStandingData(){
if(standingData&&Date.now()-standingsFetchedAt<300000)return;
if(!standingData){try{standingData=JSON.parse(localStorage.getItem('jdtStandings'));}catch(e){}}
if(standingLoading){renderStandings();return;}
standingLoading=true;renderStandings();
try{
const response=await fetch('https://raw.githubusercontent.com/syazzy55/jdt-premium/main/www/standings.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(8000)});
if(!response.ok)throw Error('HTTP');
const d=await response.json();if(!Object.values(d).some(v=>Array.isArray(v.groups)))throw Error('Invalid data');
standingData=d;standingsFetchedAt=Date.now();try{localStorage.setItem('jdtStandings',JSON.stringify(d));}catch(e){}
}catch(e){if(!standingData){try{const r=await fetch('standings.json');if(r.ok)standingData=await r.json();}catch(e){}}}
finally{standingLoading=false;renderStandings();const el=document.getElementById('homeStandings');if(el)el.innerHTML=summaryStandings();}
}

content.innerHTML='<h2>🐯 Player Centre Premium</h2><p class="muted">Profil JDT tersedia: '+players.length+' • bukan senarai skuad rasmi lengkap</p><div class="card"><input id="pcSearch" placeholder="Cari pemain" style="width:100%;padding:12px;box-sizing:border-box"><select id="pcPosition"><option value="">Semua posisi</option><option value="G">Penjaga gol</option><option value="D">Pertahanan</option><option value="M">Tengah</option><option value="F">Penyerang</option></select><div id="pcList"></div></div><h2>Ranking & perbandingan</h2><div class="card"><select id="pcLeague">'+Array.from(competitions,([k,v])=>'<option value="'+esc(k)+'">'+esc(v)+'</option>').join('')+'</select><select id="pcMetric"><option value="goals">Gol</option><option value="assists">Assist</option><option value="averageRating">Rating</option><option value="tackles">Tackles</option><option value="minutesPlayed">Minit permainan</option><option value="appearances">Perlawanan</option><option value="accuratePassesPercentage">Hantaran tepat (%)</option></select><div id="pcRank"></div><h3>Banding pemain</h3><p class="muted">🔴 Pemain pertama • 🔵 Pemain kedua</p><select id="pcA">'+opts+'</select><select id="pcB">'+opts+'</select><div id="pcCompare"></div><div id="pcForm"></div></div>';

const photo=p=>typeof p.image==='string'&&p.image.startsWith('https://cdn.sportsapi.app/')?'<img loading="lazy" src="'+esc(p.image)+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover" alt="">':'';
const flag=p=>/^[A-Z]{2}$/.test(p.country?.code||'')?String.fromCodePoint(...Array.from(p.country.code,c=>127397+c.charCodeAt(0)))+' ':'';
const renderList=()=>{const q=el('pcSearch').value.toLowerCase();el('pcList').innerHTML=players.filter(e=>e.profile.name.toLowerCase().includes(q)&&(!el('pcPosition').value||e.profile.positionCode===el('pcPosition').value)).map(({profile:p})=>'<button data-pc-id="'+esc(p.id)+'" style="display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;text-align:left">'+photo(p)+'<span>#'+esc(p.jerseyNumber)+' '+esc(p.name)+'<br><small>'+esc(flag(p)+(p.country?.name||''))+' • '+esc(({G:'Penjaga gol',D:'Pertahanan',M:'Tengah',F:'Penyerang'})[p.positionCode]||p.position||'')+'</small></span></button>').join('')||'<p>Tiada pemain ditemui.</p>';el('pcList').querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=players.find(e=>String(e.profile.id)===b.dataset.pcId).profile;b.dataset.playerId=p.id;b.dataset.player=p.name;b.dataset.team='JDT';b.dataset.stats='Pilih profil untuk statistik musim';showPitchPlayer(b);document.querySelector('#pitch-popup > button')?.click();});};
const stat=e=>(e?.statistics||[]).find(s=>key(s)===el('pcLeague').value&&String(s.team?.id)==='210860'&&s.type==='overall')?.statistics||{};
const compareBars=(a,b,k)=>{const valid=v=>v!=null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0;const max=k==='averageRating'?10:Math.max(1,valid(a)?Number(a):0,valid(b)?Number(b):0);return '<div aria-label="Merah pemain pertama, biru pemain kedua">'+[a,b].map((v,i)=>'<div class="pc-track"><i style="background:'+(i?'#5098e9':'#e34d65')+';width:'+(valid(v)?Math.min(100,Number(v)/max*100):0)+'%"></i></div>').join('')+'</div>';};
const radar=(a,b)=>{
const axes=[['Rating','averageRating',10],['Hantaran','accuratePassesPercentage',100],['Duel','duelsWonPercentage',100],['Dribble','successfulDribblesPercentage',100],['Tackles','tackles',null],['Assist','assists',null]];
const valid=v=>v!=null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0;
const usable=axes.filter(([,k])=>valid(a[k])&&valid(b[k]));
if(usable.length<3)return '<h3>Radar prestasi</h3><p class="muted">Data bersama belum mencukupi.</p>';
const point=(i,f)=>{const t=i*2*Math.PI/usable.length-Math.PI/2;return [160+90*f*Math.cos(t),140+90*f*Math.sin(t)];};
const poly=f=>usable.map((_,i)=>point(i,f(i)).join(',')).join(' ');
const max=([,k,m])=>m||Math.max(1,...players.map(e=>stat(e)[k]).filter(valid).map(Number));
return '<h3>Radar prestasi</h3><p class="muted">Skala rating /10, peratus /100; jumlah relatif kepada maksimum pemain tersedia dalam pertandingan ini.</p><svg viewBox="0 0 320 280" role="img" aria-label="Radar perbandingan pemain" style="width:100%;max-width:420px;display:block;margin:auto">'+[.25,.5,.75,1].map(f=>'<polygon points="'+poly(()=>f)+'" fill="none" stroke="#52647d" stroke-width="1"/>').join('')+usable.map(([l],i)=>{const p=point(i,1),q=point(i,1.24);return '<line x1="160" y1="140" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#52647d"/><text x="'+q[0]+'" y="'+q[1]+'" text-anchor="middle" dominant-baseline="middle" fill="#c5d3e5" font-size="10">'+l+'</text>';}).join('')+[a,b].map((v,i)=>'<polygon points="'+poly(j=>Math.min(1,Number(v[usable[j][1]])/max(usable[j])))+'" fill="'+(i?'#5098e9':'#e34d65')+'" fill-opacity=".22" stroke="'+(i?'#5098e9':'#e34d65')+'" stroke-width="2"/>').join('')+'</svg>';
};
const recentForm=id=>{
const rows=[...data.results].sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).flatMap(m=>{
const d=detailCache[String(m.id)];const side=m.venue==='Away'?'away':'home';
const p=(d?.lineups?.[side]?.players||[]).find(p=>String(p.player?.id)===id);
const v=p?.rating??p?.statistics?.rating;
return p&&v!=null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>0&&Number(v)<=10?[{m,p,v:Number(v)}]:[];
}).slice(0,5).reverse();
if(!rows.length)return '<p class="muted">Rating perlawanan belum tersedia.</p>';
const pts=rows.map((r,i)=>[rows.length===1?150:30+i*240/(rows.length-1),120-r.v*10]);
return '<svg viewBox="0 0 300 140" role="img" aria-label="Graf rating perlawanan" style="width:100%">'+[0,5,10].map(v=>'<line x1="30" x2="270" y1="'+(120-v*10)+'" y2="'+(120-v*10)+'" stroke="#52647d"/><text x="4" y="'+(124-v*10)+'" fill="#c5d3e5" font-size="10">'+v+'</text>').join('')+'<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#5098e9" stroke-width="2"/>'+pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#5098e9"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" text-anchor="middle" fill="white" font-size="10">'+rows[i].v+'</text>').join('')+'</svg>'+rows.slice().reverse().map(({m,p,v})=>'<div class="detail-row"><span>'+esc(m.opponent)+'<br><small>'+esc(m.date)+' • '+esc(m.competition||'')+' • '+esc(p.statistics?.minutesPlayed??'—')+' min</small></span>'+ratingBadge(v)+'</div>').join('');
};
const renderForm=()=>{const e=players.find(e=>String(e.profile.id)===el('pcA').value);el('pcForm').innerHTML='<h3>Prestasi terkini • '+esc(e?.profile.name||'—')+'</h3><p class="muted">Sehingga 5 perlawanan JDT dengan rating tersedia dalam cache, semua pertandingan. Bukan semestinya 5 penampilan terakhir sebenar.</p>'+recentForm(el('pcA').value);};
const renderStats=()=>{const m=el('pcMetric').value;const ranked=players.filter(e=>stat(e)[m]!=null&&Number.isFinite(Number(stat(e)[m]))).sort((a,b)=>Number(stat(b)[m])-Number(stat(a)[m]));el('pcRank').innerHTML=ranked.map((e,i)=>'<div class="pc-rank">'+photo(e.profile)+'<div><strong>'+ ((n)=>({1:'🥇',2:'🥈',3:'🥉'}[n]||n+'.'))(ranked.findIndex(x=>Number(stat(x)[m])===Number(stat(e)[m]))+1)+' '+esc(e.profile.name)+' — '+esc(stat(e)[m])+'</strong><div class="pc-track"><i style="width:'+Math.max(0,Math.min(100,Number(stat(e)[m])/(m==='averageRating'?10:m==='accuratePassesPercentage'?100:Math.max(1,Number(stat(ranked[0])[m])))*100))+'%"></i></div></div></div>').join('')||'<p>Statistik belum tersedia.</p>';const a=stat(players.find(e=>String(e.profile.id)===el('pcA').value)),b=stat(players.find(e=>String(e.profile.id)===el('pcB').value));el('pcCompare').innerHTML='<div class="pc-versus">'+[el('pcA').value,el('pcB').value].map(id=>{const e=players.find(e=>String(e.profile.id)===id);return e?'<div>'+photo(e.profile)+'<br>'+esc(e.profile.name)+'</div>':'';}).join('')+'</div><div class="popup-grid">'+[['Perlawanan','appearances'],['Gol','goals'],['Assist','assists'],['Rating','averageRating'],['Minit','minutesPlayed'],['Tackles','tackles']].map(([l,k])=>'<div><small>'+l+'</small><strong>'+esc(a[k]??'—')+' / '+esc(b[k]??'—')+'</strong>'+compareBars(a[k],b[k],k)+'</div>').join('')+'</div>'+radar(a,b);renderForm();};
el('pcSearch').oninput=renderList;el('pcPosition').onchange=renderList;['pcLeague','pcMetric','pcA','pcB'].forEach(id=>el(id).onchange=renderStats);if(players.length>1)el('pcB').selectedIndex=1;renderList();renderStats();refreshDetails().then(()=>{if(currentView==='players'&&el('pcForm'))renderForm();});
}

function stats(){
currentView='stats';
const r=data.results;
const w=r.filter(m=>m.jdtScore>m.opponentScore).length;
const d=r.filter(m=>m.jdtScore===m.opponentScore).length;
const l=r.length-w-d;
const gf=r.reduce((s,m)=>s+m.jdtScore,0);
const ga=r.reduce((s,m)=>s+m.opponentScore,0);
content.innerHTML=`
<h2>📊 Statistik JDT</h2><button class="tile" onclick="playerCentre()">🐯 Player Centre Premium</button>
<div class="grid">
<div class="card center"><h1>${r.length}</h1>Perlawanan</div>
<div class="card center"><h1 class="win">${w}</h1>Menang</div>
<div class="card center"><h1 class="draw">${d}</h1>Seri</div>
<div class="card center"><h1 class="loss">${l}</h1>Kalah</div>
<div class="card center"><h1>${gf}</h1>Gol dijaringkan</div>
<div class="card center"><h1>${ga}</h1>Gol dibolosi</div>
</div>
<div class="card center">
<h1>${r.length?Math.round(w/r.length*100):0}%</h1>
Kadar kemenangan
</div>
<p class="muted">Statistik berdasarkan keputusan yang
tersimpan dalam aplikasi, bukan keseluruhan musim.</p>`;
window.scrollTo(0,0);
}

const remoteData='https://raw.githubusercontent.com/syazzy55/jdt-premium/main/www/matches.json';
let sourceLabel='Data dalam APK';
function validData(d){return d&&Array.isArray(d.fixtures)&&Array.isArray(d.results)&&d.fixtures.every(m=>typeof m.date==='string'&&typeof m.opponent==='string')&&d.results.every(m=>typeof m.date==='string'&&typeof m.opponent==='string'&&Number.isFinite(m.jdtScore)&&Number.isFinite(m.opponentScore));}
async function readData(url,signal){const response=await fetch(url,{cache:'no-store',signal});if(!response.ok)throw Error('Data gagal dimuatkan');const d=await response.json();if(!validData(d))throw Error('Data tidak sah');return d;}
async function load(background=false){
if(loading)return;loading=true;
const previous=data;const before=JSON.stringify(data),previousSource=sourceLabel;
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),8000);
try{
data=await readData(remoteData+'?t='+Date.now(),controller.signal);
sourceLabel='Data GitHub dalam talian';
try{localStorage.setItem('jdtMatches',JSON.stringify(data));}catch(e){}
}catch(e){
try{const cached=JSON.parse(localStorage.getItem('jdtMatches'));if(!validData(cached))throw Error('Tiada cache');data=cached;sourceLabel='Data simpanan luar talian';}
catch(e){try{data=await readData('matches.json');sourceLabel='Data dalam APK';}catch(e){content.innerHTML='<div class="card">Gagal memuatkan data.<button class="tile" onclick="load()">Cuba lagi</button></div>';return;}}
}finally{clearTimeout(timeout);loading=false;}
if(sourceLabel==='Data GitHub dalam talian'&&previousSource===sourceLabel&&!document.hidden)await notifyScoreChanges(previous,data);
if(before!==JSON.stringify(data)||!background)syncReminders();
if(background&&before===JSON.stringify(data)&&previousSource===sourceLabel)return;
if(background){const y=window.scrollY;if(currentView==='detail')renderDetails();else if(currentView==='standings')renderStandings();else if(currentView==='players'){}else if(currentView==='stats')stats();else if(currentView==='fixtures'||currentView==='results')showMatches(currentView,currentFilter);else home();window.scrollTo(0,y);}else home();
tick();
}
async function notifyScoreChanges(previous,next){
if(localStorage.getItem('jdtReminders')!=='yes')return;
const p=window.Capacitor?.Plugins?.LocalNotifications;if(!p)return;
try{if((await p.checkPermissions()).display!=='granted')return;
for(const m of next.fixtures.filter(x=>['live','inprogress'].includes(x.status))){
const old=previous.fixtures.find(x=>x.id!=null&&x.id===m.id);
if(!old||!['live','inprogress'].includes(old.status)||!Number.isFinite(old.jdtScore)||!Number.isFinite(m.jdtScore)||!Number.isFinite(m.opponentScore)||m.jdtScore<=old.jdtScore)continue;
await p.schedule({notifications:[{id:2147483646,title:'JDT Premium • Perubahan skor',body:'JDT '+m.jdtScore+' - '+m.opponentScore+' '+m.opponent+' • Skor dilaporkan API',smallIcon:'ic_jdt_notification'}]});
}}catch(e){console.warn('Score notification',e);}
}
let reminderBusy=false, reminderText='';
async function syncReminders(){
const plugin=window.Capacitor?.Plugins?.LocalNotifications;
if(!plugin||localStorage.getItem('jdtReminders')!=='yes'||reminderBusy)return;
reminderBusy=true;
try{
const permission=await plugin.checkPermissions();if(permission.display!=='granted')return;
const notifications=[];
for(const m of upcoming().filter(m=>m.time).slice(0,24)){
for(const minutes of [60,15]){
const at=kickoff(m)-minutes*60000;if(at<=Date.now()+1000)continue;
const key=m.date+'|'+m.time+'|'+m.opponent+'|'+minutes;
let id=0;for(const c of key)id=(Math.imul(id,31)+c.charCodeAt(0))|0;
notifications.push({id:(id>>>0)%2147483645+1,title:'JDT Premium',smallIcon:'ic_jdt_notification',body:'JDT vs '+m.opponent+' • '+minutes+' minit lagi',schedule:{at:new Date(at),allowWhileIdle:true}});
}}
const pending=await plugin.getPending();
const old=(pending.notifications||[]).filter(n=>n.id!==2147483647&&n.id!==2147483646);
if(old.length)await plugin.cancel({notifications:old.map(n=>({id:n.id}))});
if(notifications.length)await plugin.schedule({notifications});
reminderText=notifications.length+' peringatan dijadualkan';const el=document.getElementById('reminderStatus');if(el)el.textContent=reminderText;
}catch(e){const el=document.getElementById('reminderStatus');if(el)el.textContent='Notifikasi gagal: '+String(e.message||e);}
finally{reminderBusy=false;}
}
async function testNotification(){
const p=window.Capacitor?.Plugins?.LocalNotifications;
if(!p){alert('Ujian hanya tersedia dalam APK Android.');return;}
try{
let permission=await p.checkPermissions();
if(permission.display!=='granted')permission=await p.requestPermissions();
if(permission.display!=='granted'){alert('Benarkan notifikasi dalam tetapan Android.');return;}
const id=2147483647;
const pending=await p.getPending();
if((pending.notifications||[]).some(n=>n.id===id))await p.cancel({notifications:[{id}]});
await p.schedule({notifications:[{id,title:'JDT Premium • Ujian',smallIcon:'ic_jdt_notification',body:'Notifikasi ujian berjaya sampai!',schedule:{at:new Date(Date.now()+30000),allowWhileIdle:true}}]});
alert('Ujian dijadualkan dalam 30 saat. Tekan OK dan kembali ke skrin utama telefon. Jangan paksa henti aplikasi. Android mungkin melambatkan penghantaran.');
}catch(e){alert('Ujian gagal: '+String(e.message||e));}
}
async function toggleReminders(){
const p=window.Capacitor?.Plugins?.LocalNotifications;
if(!p){alert('Notifikasi hanya tersedia dalam APK Android.');return;}
try{
if(localStorage.getItem('jdtReminders')==='yes'){
localStorage.removeItem('jdtReminders');reminderText='Peringatan tidak aktif';const el=document.getElementById('reminderStatus');if(el)el.textContent=reminderText;const pending=await p.getPending();if(pending.notifications.length)await p.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});alert('Notifikasi dimatikan');return;
}
const permission=await p.requestPermissions();if(permission.display!=='granted'){alert('Benarkan notifikasi dalam tetapan Android.');return;}
localStorage.setItem('jdtReminders','yes');await syncReminders();alert('Notifikasi diaktifkan. Semak status peringatan pada Home.');
}catch(e){alert(String(e.message||e));}
}
load();
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden)load(true);},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true);});
</script>
