<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JDT Premium</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080e1c;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:100px
}
header{
background:linear-gradient(135deg,#b50028,#102e65);
text-align:center;
padding:30px 15px;
border-bottom:4px solid #ed173b
}
header img{
width:100px;
height:100px;
object-fit:contain
}
h1{font-size:27px;margin:12px 0}
h2{font-size:19px}
small,.muted{color:#a5b7d5;font-size:12px}
main{padding:15px;max-width:800px;margin:auto}
.card{
background:linear-gradient(145deg,#182b49,#101c32);
border:1px solid #304568;
border-radius:18px;
padding:18px;
margin-bottom:14px
}
.teams{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
text-align:center;
margin:20px 0
}
.team{flex:1;font-size:13px}
.team img{
width:64px;
height:64px;
object-fit:contain;
display:block;
margin:0 auto 10px
}
.placeholder{
width:64px;
height:64px;
margin:0 auto 10px;
border-radius:50%;
background:#304568;
display:grid;
place-items:center;
font-weight:bold
}
.score{font-size:27px;font-weight:bold}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.tile{
background:#182b49;
border:1px solid #304568;
border-radius:15px;
padding:22px 10px;
color:white;
font-size:15px
}
.tile span{font-size:27px}
nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#101c32;
display:flex;
justify-content:space-around;
border-top:2px solid #ed173b;
padding:15px 0 calc(15px + env(safe-area-inset-bottom))
}
nav button{
background:none;
border:0;
color:white;
font-size:12px
}
select{
width:100%;
background:#182b49;
color:white;
border:1px solid #304568;
padding:13px;
border-radius:10px;
margin-bottom:15px
}
.win{color:#4ade80}
.draw{color:#facc15}
.loss{color:#fb7185}
.center{text-align:center}
.tag{
font-size:11px;
color:#c7d5ed;
letter-spacing:1px
}
</style>
</head>
<body>

<header>
<img src="logos/JDT.png" alt="Logo JDT">
<h1>JDT PREMIUM</h1>
<p>MATCH CENTRE • 2026/2027</p>
<small>LUASKAN KUASAMU JOHOR</small>
</header>

<main id="content">Memuatkan data...</main>

<nav>
<button onclick="home()">🏠<br>Home</button>
<button onclick="showMatches('fixtures')">📅<br>Jadual</button>
<button onclick="showMatches('results')">🏆<br>Keputusan</button>
<button onclick="stats()">📊<br>Statistik</button>
</nav>

<script>
let data={fixtures:[],results:[]};
const content=document.getElementById('content');

const logos={
'JDT':'JDT.png',
'Ratchaburi FC':'ratchaburi.png',
'Daejeon Hana Citizen':'daejeon.webp',
'Kuala Lumpur City':'klcity.jpeg',
'Cong An Hanoi':'congan.png',
'Brunei DPMM':'dpmm.png',
'Jeonbuk':'jeonbuk.png'
};

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

function team(name){
const short=esc(name.split(' ').map(x=>x[0]).join('').slice(0,3));
const file=logos[name];
return `<div class="team">
${file?`<img src="logos/${file}" alt="${esc(name)}"
onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
<div class="placeholder" style="display:none">${short}</div>`
:`<div class="placeholder">${short}</div>`}
${esc(name)}</div>`;
}

function dateText(date){
return new Date(date+'T12:00:00+08:00')
.toLocaleDateString('ms-MY',{
day:'numeric',month:'long',year:'numeric',
timeZone:'Asia/Kuala_Lumpur'
});
}

function upcoming(){
return data.fixtures.filter(m=>
(m.time ? new Date(m.date+'T'+m.time+':00+08:00') : new Date(m.date+'T23:59:59+08:00'))>new Date()
).sort((a,b)=>
(a.date+a.time).localeCompare(b.date+b.time));
}

function matchCard(m,result=false){
const away=m.venue==='Away';
let score='VS';
let status='';
if(result){
score=away?
m.opponentScore+' - '+m.jdtScore:
m.jdtScore+' - '+m.opponentScore;
status=m.jdtScore>m.opponentScore?
'<b class="win">MENANG</b>':
m.jdtScore===m.opponentScore?
'<b class="draw">SERI</b>':
'<b class="loss">KALAH</b>';
}
return `<div class="card">
<div class="tag">${esc(m.competition)}</div>
<div class="teams">
${team(away?m.opponent:'JDT')}
<div class="score">${score}</div>
${team(away?'JDT':m.opponent)}
</div>
<div class="center">
${dateText(m.date)}
${result?'':' • '+(m.time?esc(m.time)+' MYT':'Masa belum disahkan')}
<p class="muted">${away?'AWAY':'HOME'}</p>
${status}
</div>
</div>`;
}

function home(){
const next=upcoming()[0];
const latest=[...data.results].sort((a,b)=>
b.date.localeCompare(a.date))[0];

content.innerHTML=`
<p class="tag">PERLAWANAN SETERUSNYA</p>
${next?matchCard(next):'<div class="card">Tiada jadual akan datang dalam data.</div>'}
<div class="grid">
<button class="tile" onclick="showMatches('fixtures')">
<span>📅</span><br>Jadual</button>
<button class="tile" onclick="showMatches('results')">
<span>🏆</span><br>Keputusan</button>
<button class="tile" onclick="stats()">
<span>📊</span><br>Statistik</button>
<button class="tile" onclick="load()">
<span>🔄</span><br>Muat semula</button>
</div>
<h2>Keputusan terkini</h2>
${latest?matchCard(latest,true):'Tiada keputusan'}
<p class="muted center">
${esc(sourceLabel)}: ${esc(data.updated)}<br>
JDT Premium v1.1<br>
Aplikasi penyokong tidak rasmi
</p>`;
window.scrollTo(0,0);
}

function showMatches(type,filter='all'){
const result=type==='results';
const list=[...data[type]].sort((a,b)=>
result?b.date.localeCompare(a.date):
a.date.localeCompare(b.date));
const comps=[...new Set(list.map(m=>m.competition))];
const filtered=list.filter(m=>
filter==='all'||m.competition===filter);

content.innerHTML=`
<h2>${result?'🏆 Keputusan':'📅 Jadual'} JDT</h2>
<select id="competition">
<option value="all">Semua pertandingan</option>
${comps.map(c=>`<option value="${esc(c)}"
${filter===c?'selected':''}>${esc(c)}</option>`).join('')}
</select>
${filtered.map(m=>matchCard(m,result)).join('')
||'<div class="card">Tiada perlawanan</div>'}
<p class="muted">${esc(sourceLabel)}: ${esc(data.updated)}.
Jadual tertakluk kepada perubahan.</p>`;
document.getElementById('competition').onchange=e=>
showMatches(type,e.target.value);
window.scrollTo(0,0);
}

function stats(){
const r=data.results;
const w=r.filter(m=>m.jdtScore>m.opponentScore).length;
const d=r.filter(m=>m.jdtScore===m.opponentScore).length;
const l=r.length-w-d;
const gf=r.reduce((s,m)=>s+m.jdtScore,0);
const ga=r.reduce((s,m)=>s+m.opponentScore,0);
content.innerHTML=`
<h2>📊 Statistik JDT</h2>
<div class="grid">
<div class="card center"><h1>${r.length}</h1>Perlawanan</div>
<div class="card center"><h1 class="win">${w}</h1>Menang</div>
<div class="card center"><h1 class="draw">${d}</h1>Seri</div>
<div class="card center"><h1 class="loss">${l}</h1>Kalah</div>
<div class="card center"><h1>${gf}</h1>Gol dijaringkan</div>
<div class="card center"><h1>${ga}</h1>Gol dibolosi</div>
</div>
<div class="card center">
<h1>${r.length?Math.round(w/r.length*100):0}%</h1>
Kadar kemenangan
</div>
<p class="muted">Statistik berdasarkan keputusan yang
tersimpan dalam aplikasi, bukan keseluruhan musim.</p>`;
window.scrollTo(0,0);
}

const remoteData='https://raw.githubusercontent.com/syazzy55/jdt-premium/main/www/matches.json';
let sourceLabel='Data dalam APK';
function validData(d){return d&&Array.isArray(d.fixtures)&&Array.isArray(d.results)&&d.fixtures.every(m=>typeof m.date==='string'&&typeof m.opponent==='string')&&d.results.every(m=>typeof m.date==='string'&&typeof m.opponent==='string'&&Number.isFinite(m.jdtScore)&&Number.isFinite(m.opponentScore));}
async function readData(url,signal){const response=await fetch(url,{cache:'no-store',signal});if(!response.ok)throw Error('Data gagal dimuatkan');const d=await response.json();if(!validData(d))throw Error('Data tidak sah');return d;}
async function load(){
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),8000);
try{
data=await readData(remoteData+'?t='+Date.now(),controller.signal);
sourceLabel='Data GitHub dalam talian';
try{localStorage.setItem('jdtMatches',JSON.stringify(data));}catch(e){}
}catch(e){
try{const cached=JSON.parse(localStorage.getItem('jdtMatches'));if(!validData(cached))throw Error('Tiada cache');data=cached;sourceLabel='Data simpanan luar talian';}
catch(e){try{data=await readData('matches.json');sourceLabel='Data dalam APK';}catch(e){content.innerHTML='<div class="card">Gagal memuatkan data.<button class="tile" onclick="load()">Cuba lagi</button></div>';return;}}
}finally{clearTimeout(timeout);}
home();
}
load();
</script>
</body>
</html>
