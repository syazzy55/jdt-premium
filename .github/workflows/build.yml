name: Build JDT Premium APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync application
        run: npx cap sync android

      - name: Install custom launcher icon
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open('www/logos/app-icon.png').convert('RGBA')
          res = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = res / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              for name in ['ic_launcher', 'ic_launcher_round']:
                  im.resize((size,size), Image.Resampling.LANCZOS).save(folder / (name + '.png'))
          for folder in res.glob('mipmap-anydpi*'):
              for name in ['ic_launcher.xml','ic_launcher_round.xml']:
                  (folder / name).unlink(missing_ok=True)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JDT-Premium-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
