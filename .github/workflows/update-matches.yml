name: Update JDT match data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Test ESPN coverage
        run: |
          python3 - <<'PY'
          import json, urllib.request
          found=0
          for league in ['mys.1','afc.champions','mys.fa','mys.cup','asean.club']:
              try:
                  url='https://site.api.espn.com/apis/site/v2/sports/soccer/'+league+'/scoreboard?dates=20260801-20270531&limit=1000'
                  with urllib.request.urlopen(url,timeout=30) as r:
                      data=json.load(r)
                  events=data.get('events',[])
                  matches=[e for e in events if 'johor' in json.dumps(e.get('competitions',[])).lower()]
                  print(league, 'events:',len(events),'JDT:',len(matches))
                  for e in matches[:3]: print(e.get('date'),e.get('name'))
                  found+=len(matches)
              except Exception as e:
                  print(league,type(e).__name__,str(e))
          if not found: raise SystemExit('No JDT records verified')
          PY
