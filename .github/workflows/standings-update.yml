name: JDT Standings Update
on:
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * *'
permissions:
  contents: write
concurrency:
  group: jdt-standings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/standings-update.py
        env:
          SPORTSAPI_KEY: ${{ secrets.SPORTSAPI_KEY }}
      - run: |
          git config user.name "JDT Smart Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/standings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update standings"
            git pull --rebase
            git push
          fi
