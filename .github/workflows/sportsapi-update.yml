
name: SportsAPI Smart Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: sportsapi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update JDT matches
        env:
          SPORTSAPI_KEY: ${{ secrets.SPORTSAPI_KEY }}
        run: python scripts/sportsapi-update.py

      - name: Save updated matches
        run: |
          git config user.name "JDT Smart Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add www/matches.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "SportsAPI: Update JDT matches"
            git push
          fi
